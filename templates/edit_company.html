
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Company - Job Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('companies') }}">← Back to Companies</a>

        <h1>Edit Company</h1>

        <form method="POST">
            <label>Company Name</label>
            <input type="text" name="company_name"
                   value="{{ company.company_name }}"
                   maxlength="100" required>

            <label>Industry</label>
            <input type="text" name="industry"
                   value="{{ company.industry or '' }}"
                   maxlength="50">

            <label>Website</label>
            <input type="text" name="website"
                   value="{{ company.website or '' }}"
                   maxlength="200">

            <label>City</label>
            <input type="text" name="city"
                   value="{{ company.city or '' }}"
                   maxlength="50">

            <label>State</label>
            <input type="text" name="state"
                   value="{{ company.state or '' }}"
                   maxlength="50">

            <label>Notes</label>
            <textarea name="notes" rows="4">{{ company.notes or '' }}</textarea>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>
</html>
