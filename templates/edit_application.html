
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Application - Job Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="checkbox"] {
            width: auto;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">

    <a href="{{ url_for('applications') }}">← Back to Applications</a>
    <h1>Edit Application</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Job</label>
        <select name="job_id" required>
            {% for job in jobs %}
                <option value="{{ job.job_id }}"
                    {% if job.job_id == application.job_id %}
                        selected
                    {% endif %}>
                    {{ job.company_name }} - {{ job.job_title }}
                </option>
            {% endfor %}
        </select>

        <label>Application Date</label>
        <input type="date"
               name="application_date"
               value="{{ application.application_date }}"
               required>

        <label>Application Status</label>
        <select name="status" required>
            {% for status in statuses %}
                <option value="{{ status }}"
                    {% if application.status == status %}
                        selected
                    {% endif %}>
                    {{ status }}
                </option>
            {% endfor %}
        </select>

        <label>Resume Version</label>
        <input type="text"
               name="resume_version"
               value="{{ application.resume_version or '' }}"
               maxlength="50">

        <label>
            <input type="checkbox"
                   name="cover_letter_sent"
                   {% if application.cover_letter_sent %}checked{% endif %}>
            Cover Letter Sent
        </label>

        <label>Interview Notes</label>
        <textarea name="interview_notes"
                  rows="4">{{ application.interview_notes }}</textarea>

        <button type="submit">Save Changes</button>

    </form>
</div>
</body>
</html>
