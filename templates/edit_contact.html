
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Contact - Job Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
            color: #1f2937;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .message {
            background: #e0f2fe;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">

    <a href="{{ url_for('contacts') }}">← Back to Contacts</a>
    <h1>Edit Contact</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Company</label>
        <select name="company_id" required>
            {% for company in companies %}
                <option value="{{ company.company_id }}"
                    {% if company.company_id == contact.company_id %}
                        selected
                    {% endif %}>
                    {{ company.company_name }}
                </option>
            {% endfor %}
        </select>

        <label>Contact Name</label>
        <input type="text"
               name="contact_name"
               value="{{ contact.contact_name }}"
               maxlength="100"
               required>

        <label>Job Title</label>
        <input type="text"
               name="title"
               value="{{ contact.title or '' }}"
               maxlength="100">

        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ contact.email or '' }}"
               maxlength="100">

        <label>Phone Number</label>
        <input type="tel"
               name="phone"
               value="{{ contact.phone or '' }}"
               maxlength="20">

        <label>LinkedIn URL</label>
        <input type="url"
               name="linkedin_url"
               value="{{ contact.linkedin_url or '' }}"
               maxlength="200">

        <label>Notes</label>
        <textarea name="notes"
                  rows="4">{{ contact.notes or '' }}</textarea>

        <button type="submit">Save Changes</button>

    </form>
</div>
</body>
</html>
